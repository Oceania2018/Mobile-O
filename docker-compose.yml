services:
  gpu-worker:
    image: mobile-o-api:latest
    container_name: mobile-o-gpu-worker
    volumes:
      - .:/workspaces/mobile-o-inference
    working_dir: /workspaces/mobile-o-inference
    entrypoint: []
    # Serves the OpenAI-compatible HTTP API on :8400 for the llm-inference-daemon.
    command: python gpu_worker.py --model_path checkpoints/final_merged_model_23620 --http_port 8400 --model_id mobile-o-0.5b
    ports:
      - "8400:8400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
